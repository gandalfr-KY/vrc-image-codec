name: Benchmark tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m py_compile Tools~/benchmark.py Tools~/pack.py
      - run: python Tools~/benchmark.py --help
# The ClientSim benchmark requires licensed Unity and a D3D11 GPU; see Tests~/README.md.
