name: Codec regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CSC: /usr/bin/mono-csc
      MONO: /usr/bin/mono
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y mono-devel ffmpeg
      - run: python Tools~/check-codec.py
      - run: python Tools~/check-decoder.py
